name: Garder l'API éveillée (Render)

# L'API (Render, plan gratuit) s'endort après 15 min sans trafic, ce qui rend
# la 1ʳᵉ connexion lente/échouée. Ce workflow la « pique » régulièrement pour
# la garder chaude 24/7. Dépôt public → minutes GitHub Actions gratuites.

on:
  schedule:
    - cron: "*/10 * * * *" # toutes les ~10 min
  workflow_dispatch: {}

# Un seul ping à la fois (évite les exécutions qui s'empilent)
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /api/health (x2 pour couvrir les délais du planificateur)
        run: |
          for i in 1 2; do
            echo "Ping $i — $(date -u)"
            curl -fsS -m 60 https://gcave-api.onrender.com/api/health && echo "" || echo "(ping $i en échec, on réessaie au prochain cycle)"
            [ "$i" -lt 2 ] && sleep 300
          done
